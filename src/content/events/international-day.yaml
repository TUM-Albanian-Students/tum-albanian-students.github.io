# The exact day isn’t recorded, so only year and month are given.
date: 2024-10
place: TUM School of Computation, Information and Technology

en:
  title: TUM International Day
  summary: Representing Albania and Kosovo at TUM.
  body: >-
    We represented Albania and Kosovo at the International Day of TUM’s School of
    Computation, Information and Technology, sharing our history, traditions and
    culture with the TUM community.
  highlights:
    - A stand on Albanian and Kosovar traditions
    - Short presentations on our history and heritage
    - Conversations with students from all over the world

sq:
  title: Dita Ndërkombëtare e TUM
  summary: Përfaqësuam Shqipërinë dhe Kosovën në TUM.
  body: >-
    Përfaqësuam Shqipërinë dhe Kosovën në Ditën Ndërkombëtare të TUM School of
    Computation, Information and Technology, duke ndarë historinë, traditat dhe
    kulturën tonë me komunitetin e TUM.
  highlights:
    - Një stendë me traditat shqiptare dhe kosovare
    - Prezantime të shkurtra për historinë dhe trashëgiminë tonë
    - Biseda me studentë nga e gjithë bota

de:
  title: TUM International Day
  summary: Albanien und Kosovo an der TUM vertreten.
  body: >-
    Beim International Day der TUM School of Computation, Information and
    Technology haben wir Albanien und Kosovo vertreten und unsere Geschichte,
    Traditionen und Kultur mit der TUM-Community geteilt.
  highlights:
    - Ein Stand zu albanischen und kosovarischen Traditionen
    - Kurze Vorträge zu unserer Geschichte und Herkunft
    - Gespräche mit Studierenden aus aller Welt
